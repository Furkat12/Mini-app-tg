<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>QuickTools</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f1f5f9;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    header {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      text-align: center;
      padding: 26px 18px;
      border-radius: 0 0 25px 25px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      font-size: 14px;
    }

    main {
      width: min(100% - 28px, 500px);
      margin: 22px auto;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 20px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(15, 23, 42, 0.08);
    }

    h2 {
      margin: 0 0 10px;
      font-size: 21px;
    }

    .muted {
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
      font-size: 14px;
    }

    textarea {
      width: 100%;
      min-height: 105px;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      font-family: Arial, sans-serif;
      resize: vertical;
      outline-color: #2563eb;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #e2e8f0;
      color: #172033;
    }

    .success {
      background: #16a34a;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
    }

    #result {
      display: none;
      text-align: center;
      margin-top: 22px;
    }

    #qrImage {
      display: block;
      width: 260px;
      max-width: 100%;
      margin: 18px auto;
      border: 8px solid white;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    }

    #message {
      color: #dc2626;
      font-size: 14px;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      padding: 15px;
    }
  </style>
</head>

<body>

<header>
  <h1>⚡ QuickTools</h1>
  <p>Bepul va qulay telefon vositalari</p>
</header>

<main>

  <section class="card">
    <h2>🔲 QR kod yaratish</h2>

    <p class="muted">
      Matn yoki havolani yozing va QR kod yarating.
    </p>

    <label for="qrText">Matn yoki havola</label>

    <textarea
      id="qrText"
      maxlength="2000"
      placeholder="Masalan: https://telegram.org"
    ></textarea>

    <button class="primary" id="createBtn">
      ✨ QR kod yaratish
    </button>

    <p id="message"></p>

    <div id="result">

      <h3>QR kodingiz tayyor! ✅</h3>

      <img id="qrImage" alt="QR kod">

      <button class="success" id="saveBtn">
        📥 PNG sifatida saqlash
      </button>

      <button class="secondary" id="shareBtn">
        📤 Ulashish / Saqlash
      </button>

      <button class="secondary" id="resetBtn">
        🔄 Yangidan yaratish
      </button>

    </div>
  </section>

  <section class="card">
    <h2>🛠 Keyingi vositalar</h2>

    <p class="muted">
      📷 Rasm siqish<br><br>
      📐 Rasm o‘lchamini o‘zgartirish<br><br>
      📝 Matn vositasi
    </p>
  </section>

</main>

<footer>
  QuickTools © 2026
</footer>

<script>

const textInput = document.getElementById("qrText");
const createBtn = document.getElementById("createBtn");
const saveBtn = document.getElementById("saveBtn");
const shareBtn = document.getElementById("shareBtn");
const resetBtn = document.getElementById("resetBtn");

const result = document.getElementById("result");
const qrImage = document.getElementById("qrImage");
const message = document.getElementById("message");

let qrBlob = null;
let qrUrl = null;


/* QR YARATISH */

createBtn.addEventListener("click", async () => {

  const text = textInput.value.trim();

  message.textContent = "";
  result.style.display = "none";

  if (!text) {
    message.textContent = "Avval matn yoki havola yozing.";
    return;
  }

  createBtn.disabled = true;
  createBtn.textContent = "Yaratilmoqda...";

  try {

    const qrApi =
      "https://api.qrserver.com/v1/create-qr-code/?size=600x600&format=png&data="
      + encodeURIComponent(text);

    const response = await fetch(qrApi);

    if (!response.ok) {
      throw new Error("QR yaratilmadi");
    }

    qrBlob = await response.blob();

    if (!qrBlob.type.includes("image")) {
      throw new Error("PNG olinmadi");
    }

    if (qrUrl) {
      URL.revokeObjectURL(qrUrl);
    }

    qrUrl = URL.createObjectURL(qrBlob);

    qrImage.src = qrUrl;

    result.style.display = "block";

  } catch (error) {

    message.textContent =
      "QR yaratishda xatolik yuz berdi. Internetni tekshiring.";

  } finally {

    createBtn.disabled = false;
    createBtn.textContent = "✨ QR kod yaratish";

  }

});


/* PNG YUKLAB OLISH */

saveBtn.addEventListener("click", () => {

  if (!qrBlob) {
    message.textContent = "Avval QR kod yarating.";
    return;
  }

  const link = document.createElement("a");

  link.href = qrUrl;
  link.download = "QuickTools-QR.png";

  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);

});


/* ANDROID SHARE / SAQLASH */

shareBtn.addEventListener("click", async () => {

  if (!qrBlob) {
    message.textContent = "Avval QR kod yarating.";
    return;
  }

  try {

    const file = new File(
      [qrBlob],
      "QuickTools-QR.png",
      {
        type: "image/png"
      }
    );

    if (
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({ files: [file] })
    ) {

      await navigator.share({
        title: "QuickTools QR",
        text: "QuickTools orqali yaratilgan QR kod",
        files: [file]
      });

    } else {

      message.textContent =
        "Ulashish mavjud emas. PNG saqlash tugmasini bosing.";

    }

  } catch (error) {

    if (error.name !== "AbortError") {
      message.textContent =
        "Ulashishda xatolik yuz berdi.";
    }

  }

});


/* RESET */

resetBtn.addEventListener("click", () => {

  textInput.value = "";

  result.style.display = "none";

  message.textContent = "";

  if (qrUrl) {
    URL.revokeObjectURL(qrUrl);
    qrUrl = null;
  }

  qrBlob = null;

  textInput.focus();

});

</script>

</body>
</html>
